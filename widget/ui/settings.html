<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>显示配置</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="settings.js"></script>
</head>
<body class="settings-page">

<!-- 票 04 · 设置窗（托盘「设置…」按需创建、关闭即销毁——销毁在 Rust 侧）。
     表格行=settings.js 依对象目录（data.js 演示契约）× 显示配置（profile.js）生成。 -->
<div class="sheet">
  <h2>显示配置</h2>
  <div class="note warn hidden" id="resetNotice"></div>
  <div class="note">配置存 widget 本地 JSON，daemon 不感知；查询永远面向全部上游，这里只管“怎么显示”。改动即时生效、自动保存。</div>
  <div class="radioline">布局：
    <label><input type="radio" name="layout" value="vertical" checked> 竖排贴右缘（默认）</label>
    <label style="margin-left:14px"><input type="radio" name="layout" value="horizontal"> 横排贴上缘</label>
  </div>
  <div class="radioline"><label><input type="checkbox" id="optCdline" checked> 显示重置倒计时行</label> <span class="hint">（5h/周窗圆控件下方第一行；显示配置，daemon 不感知）</span></div>
  <table class="set">
    <thead><tr><th>显示</th><th>对象</th><th>环色</th><th>告警阈值</th><th>月预算</th><th>顺序</th></tr></thead>
    <tbody id="objRows"></tbody>
  </table>
  <div class="note">月预算不设=文字计数（现状）；设了=紫环（剩余制：1−已用/预算，caption 保留）。DeepSeek 预算环勾“开”=绿环（已用=本月花费）。同一家可有多条上游（渡口上游表按名键控），每条各一套显示配置。</div>
  <div class="statusline" id="status"></div>
</div>

<!-- 设置窗自测结果载体（?selftest=1 才写入；静态断言读 data-*） -->
<div id="selftest-results" class="hidden" aria-hidden="true"></div>

</body>
</html>
