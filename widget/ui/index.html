<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Ferryman 用量悬浮窗</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>

<!-- 悬浮窗本体：disc 由 app.js 依契约 JSON 渲染（数据层=data.js，零散落硬编码） -->
<div class="widget vertical" id="widget">
  <div class="grip" data-tauri-drag-region title="拖动移动（位置记忆）｜外观切换：托盘菜单「切换…外观」">⠿</div>
  <button class="gear" id="btnSettings" title="打开显示配置（独立窗口）">⚙</button>
  <div class="conn-warn" id="connWarn">⚠ daemon 不可达</div>
  <!-- 票 05 · 升级通知条：托盘「检查更新」后 Rust emit 结果，这里如实显示（无新版/有新版/失败原因）；
       壳内事件驱动，演示/headless 语境永不出现 -->
  <div class="update-warn hidden" id="updateNotice"><span id="updateMsg"></span><button type="button" class="hidden" id="btnUpdateInstall">下载安装</button></div>
</div>

<!-- 收起恢复（浏览器/测试语境的 UI 演示；壳内收起/恢复=托盘菜单，票 02） -->
<button id="restoreBtn">↩ 恢复悬浮窗</button>

<div class="tooltip hidden" id="tooltip"></div>
<div class="detail hidden" id="detail"></div>

<!-- 0.2.4 浮层退役：原此处 #settings 窗内设置浮层已删除（随窗口缩水不可用）；
     设置统一走托盘「设置…」/齿轮打开的独立设置窗（settings.html），
     图例与帮助迁入该窗「图例与帮助」区块 -->

<!-- dev 构建角标（release 由 Rust 侧不带 ?dev=1 → 不显示） -->
<div class="dev-badge" id="devBadge">演示数据</div>

<!-- 六项交互自测结果载体（?selftest=1 才写入；静态断言读 data-*） -->
<div id="selftest-results" class="hidden" aria-hidden="true"></div>

</body>
</html>
