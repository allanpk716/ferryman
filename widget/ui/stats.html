<!DOCTYPE html>
<!-- 成品出处:界面真源=widget/ui/mock/stats.html(kimi 初稿 2026-10-08 夜链票02 + 用户评审 r1 热力正梯度 GitHub 绿 + r2 月份标签防重叠),布局/配色/交互零改动; -->
<!-- 票05(2026-10-09)只换数据层:去 stats.data.js 快照,轮询 daemon /stats/summary + /stats/usage(Bearer,30s+首屏立即拉);dayValue 成本/节省档接 days[].savings(毛省/净额);净额以端点值为真值(不移植快照脚本舍入) -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferryman 统计 · 成本成效账</title>
<style>
:root{
  --bg:#0b0d12; --wbg:#101218; --panel:#171b26; --panel2:#1c2230;
  --line:rgba(255,255,255,.09); --txt:#E8EAF0; --txt-dim:#8b93a7;
  --blue:#5B9BD5; --blue-t:#9CC4E8;
  --amber:#E8A33D; --purple:#9B7EDE; --green:#6BBF8A; --cyan:#4FC3C8;
  --alert-y:#E8C33D; --alert-r:#E85D5D;
  /* 热力正梯度(GitHub 绿,浅→深 4 级:L1 最少 … L4 最多) */
  --heat0:#1a2030; --heat1:#9be9a8; --heat2:#40c463; --heat3:#30a14e; --heat4:#216e39;
  /* 负值日梯度(青绿冷色,暗→亮 4 级) */
  --neg1:#123f42; --neg2:#1e6b70; --neg3:#2f9aa0; --neg4:#4FC3C8;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font:13px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding:16px}
.wrap{max-width:1080px;margin:0 auto}
h1{font-size:18px;font-weight:600;margin:0}
.sub{color:var(--txt-dim);font-size:12px;margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:14px}
.num{font-variant-numeric:tabular-nums}

/* daemon 不可达/401 顶部错误条(数据层新增;不清空已渲染内容) */
.errbar{display:none;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--alert-y);
  color:var(--alert-y);border-radius:10px;padding:10px 14px;margin-top:14px;font-size:12px}

/* KPI */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media(min-width:900px){.kpis{grid-template-columns:repeat(5,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .label{color:var(--txt-dim);font-size:12px;display:flex;align-items:center;gap:4px}
.kpi .value{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:6px}
.kpi .note{color:var(--txt-dim);font-size:11px;margin-top:6px;line-height:1.4}
.badge{display:inline-block;background:var(--panel2);border:1px solid var(--alert-y);color:var(--alert-y);
  border-radius:4px;font-size:11px;padding:1px 6px;margin-top:6px;font-weight:600}
.info{cursor:help;color:var(--txt-dim);border:1px solid var(--line);border-radius:50%;
  width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;font-size:10px}

/* 分段切换 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--txt-dim);padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--panel2);color:var(--blue-t)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}

/* 热力图 */
.heat-scroll{overflow-x:auto;margin-top:12px;padding-bottom:4px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:11px;gap:2px;width:max-content}
.cell{width:11px;height:11px;border-radius:2px;background:var(--heat0)}
.cell.l1{background:var(--heat1)}.cell.l2{background:var(--heat2)}.cell.l3{background:var(--heat3)}.cell.l4{background:var(--heat4)}
/* r1:深绿格(#216e39)在深色卡片上的分离度 */
.cell.l1,.cell.l2,.cell.l3,.cell.l4{border:1px solid rgba(255,255,255,.12)}
.cell.n1{background:var(--neg1)}.cell.n2{background:var(--neg2)}.cell.n3{background:var(--neg3)}.cell.n4{background:var(--neg4)}
.cell:hover{outline:1px solid var(--blue-t)}
.months{display:grid;grid-auto-flow:column;gap:2px;width:max-content;margin-left:32px;font-size:10px;color:var(--txt-dim)}
.months span{width:11px;overflow:visible;white-space:nowrap}
.heat-row{display:flex}
.dows{display:grid;grid-template-rows:repeat(7,11px);gap:2px;margin-right:4px;font-size:9px;color:var(--txt-dim);width:28px}
.dows span{height:11px;line-height:11px}
.legend{display:flex;align-items:center;gap:6px;color:var(--txt-dim);font-size:11px;margin-top:10px;flex-wrap:wrap}
.legend .sw{width:11px;height:11px;border-radius:2px;display:inline-block}
.tip{position:fixed;z-index:50;background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;font-size:11px;pointer-events:none;display:none;max-width:260px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.tip .d{color:var(--blue-t);font-weight:600;margin-bottom:2px}
.tip .dim{color:var(--txt-dim)}

/* 明细表 */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.filters label{color:var(--txt-dim);font-size:11px;display:flex;align-items:center;gap:4px}
.filters input{background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--txt);
  padding:4px 8px;font-size:12px;font-family:inherit;color-scheme:dark}
.tbl-scroll{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:12px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--txt-dim);font-weight:600;font-size:11px}
td.num,th.num{text-align:right}
tbody tr:hover{background:var(--panel2)}
.ellipsis{max-width:180px;overflow:hidden;text-overflow:ellipsis}
.pager{display:flex;align-items:center;gap:10px;margin-top:10px;justify-content:flex-end}
.pager button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--txt);
  padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager span{color:var(--txt-dim);font-size:11px}

footer{color:var(--txt-dim);font-size:11px;margin:16px 0 8px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <h1>用量统计</h1>
  <div class="sub" id="subtitle">加载中…</div>

  <div class="errbar" id="errbar">连不上守护进程,正在重试…</div>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <div class="card-head">
      <div>
        <div style="font-weight:600">用量热力图</div>
        <div class="sub">逐日用量</div>
      </div>
      <div class="seg" id="seg"></div>
    </div>
    <div class="heat-scroll">
      <div class="months" id="months"></div>
      <div class="heat-row">
        <div class="dows"><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span><span>日</span></div>
        <div class="heat" id="heat"></div>
      </div>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="card">
    <div style="font-weight:600">请求明细</div>
    <div class="filters">
      <label>从 <input type="date" id="f-from"></label>
      <label>到 <input type="date" id="f-to"></label>
      <label>项目 <input type="text" id="f-project" placeholder="完整路径…" size="14"></label>
      <label>模型 <input type="text" id="f-model" placeholder="包含…" size="12"></label>
    </div>
    <div class="tbl-scroll">
      <table>
        <thead><tr>
          <th>时间</th><th>项目</th><th>会话</th><th>模型</th>
          <th class="num">输入</th><th class="num">输出</th><th class="num">缓存读</th><th class="num">缓存写</th><th class="num">成本</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pager">
      <button id="prev">上一页</button>
      <span id="pageinfo"></span>
      <button id="next">下一页</button>
    </div>
  </div>

  <footer id="footer">数据:守护进程实时 · 每 30 秒刷新</footer>
</div>

<div class="tip" id="tip"></div>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };

/* ---------- 数据层(票05):轮询 daemon 两端点,Bearer 鉴权 ---------- */
/* 取数先例=widget/ui/data.js 与 ferryman-settings.js 的 get_daemon_config:
   壳内 invoke 现读 ~/ferryman/daemon.token;浏览器/测试语境 __WIDGET_DAEMON_URL__
   注入;都没有则裸试默认口(127.0.0.1:15700),401/不可达在错误条如实报。 */
var POLL_MS = 30000; /* 30 秒轮询;首屏立即拉(loop() 首调用不等) */
var BASE = "", TOKEN = "";
var D = null; /* 最近一次成功的 /stats/summary;拉取失败不清空,界面保持旧值 */

async function resolveTarget(){
  var t = window.__TAURI__;
  if(t && t.core && t.core.invoke){
    try{
      var cfg = await t.core.invoke("get_daemon_config");
      if(cfg && typeof cfg.url === "string" && cfg.url){
        BASE = new URL(cfg.url).origin;
        TOKEN = typeof cfg.token === "string" ? cfg.token : "";
        return;
      }
    }catch(e){ /* 读 token 失败:回落默认口裸试,失败在错误条如实报 */ }
  }
  var url = String(window.__WIDGET_DAEMON_URL__ || "");
  TOKEN = String(window.__WIDGET_TOKEN__ || "");
  if(url){ try{ BASE = new URL(url).origin; }catch(e){ BASE = url; } return; }
  BASE = "http://127.0.0.1:15700";
}

async function api(path){
  var headers = {};
  if(TOKEN) headers.Authorization = "Bearer " + TOKEN;
  var r = await fetch(BASE + path, { headers: headers, signal: AbortSignal.timeout(8000) });
  if(!r.ok) throw new Error("HTTP " + r.status); /* 含 401 → 错误条,不清内容 */
  return r.json();
}

var errbar = $("errbar");
function setErr(on){ errbar.style.display = on ? "flex" : "none"; }

/* ---------- 格式化(与 mock 同款) ---------- */
function fmtTok(n){
  if(n==null) return "—";
  if(n>=1e9) return (n/1e9).toFixed(1)+"B";
  if(n>=1e6) return (n/1e6).toFixed(1)+"M";
  if(n>=1e3) return (n/1e3).toFixed(1)+"K";
  return String(n);
}
function fmtInt(n){ return n==null ? "—" : Number(n).toLocaleString("en-US"); }
function fmtCredits(n){ return n==null ? "—" : Number(n).toFixed(2); }
function fmtPct(r){ return r==null ? "—" : (r*100).toFixed(2)+"%"; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

/* ---------- 摘要渲染(/stats/summary) ---------- */
function renderSummary(){
  var dayCount = D.days.length;
  if(!dayCount){ $("subtitle").textContent = "无数据"; return; }
  var startDate = D.days[0].date;
  var endDate = D.days[dayCount-1].date;
  $("subtitle").textContent = "数据区间 "+startDate+" ~ "+endDate+"(共 "+dayCount+" 天)· 生成于 "+D.generated_at;
  renderKpis();
  buildSeg();
  renderHeat();
}

var kpiCard = function(label, value, extra){
  return '<div class="kpi"><div class="label">'+label+'</div><div class="value">'+value+"</div>"+extra+"</div>";
};

function renderKpis(){
  var k = D.kpi;
  var tokTotal = k.tokens.input + k.tokens.cache_read + k.tokens.cache_creation + k.tokens.output;
  var kpisHtml = "";

  /* 总成本(不可算态) */
  if(k.cost.computable){
    kpisHtml += kpiCard("总成本", fmtCredits(k.cost.value)+" "+esc(k.cost.unit), "");
  }else{
    kpisHtml += kpiCard("总成本", '<span class="badge">不可算</span>',
      '<div class="note">'+esc(k.cost.note)+"</div>");
  }
  /* 总请求数(口径小字:逐请求行=账本 usage 行,含子代理行) */
  kpisHtml += kpiCard("总请求数", '<span class="num">'+fmtInt(k.requests)+"</span>",
    '<div class="note">口径:逐请求行,含子代理行</div>');
  /* 真实消耗 Tokens */
  kpisHtml += kpiCard("真实消耗 Tokens", '<span class="num">'+fmtTok(tokTotal)+"</span>",
    '<div class="note">输入/输出/缓存读/缓存写 四列合计</div>');
  /* 缓存命中率(带公式 tooltip) */
  kpisHtml += kpiCard(
    '缓存命中率 <span class="info" title="命中=缓存读/(缓存读+新输入)">i</span>',
    '<span class="num">'+fmtPct(k.cache_hit.rate)+"</span>",
    '<div class="note">'+fmtTok(k.cache_hit.hit)+" / "+fmtTok(k.cache_hit.base)+"</div>");
  /* 节省额(不可算态,仍展示交接成本);净额以端点值为真值(SavingsV1 原值,不移植快照脚本舍入) */
  if(k.savings.computable){
    kpisHtml += kpiCard("节省额", '<span class="num">'+fmtCredits(k.savings.net)+"</span> "+esc(k.savings.unit),
      '<div class="note">毛省 '+fmtCredits(k.savings.gross)+" − 注入 "+fmtCredits(k.savings.inject_cost)+"</div>");
  }else{
    var c = k.savings.counts;
    kpisHtml += kpiCard("节省额", '<span class="badge">不可算</span>',
      '<div class="note">'+esc(k.savings.note)+"</div>"+
      '<div class="note" style="margin-top:8px">仅交接成本可计(积分):<span class="num" style="color:var(--amber);font-weight:600">'+
      fmtCredits(k.savings.handoff_cost)+"</span> "+esc(k.savings.unit)+"</div>"+
      '<div class="note">交接 '+c.handoff+" · 注入 "+c.inject+" · 窗口 "+c.window+" · 拦截 "+c.block+" · 放行 "+c.bypass+"</div>");
  }
  $("kpis").innerHTML = kpisHtml;
}

/* ---------- 热力图 ---------- */
var curMode = "tokens";

function buildSeg(){
  var k = D.kpi;
  var MODES = [
    {key:"tokens",   label:"Tokens"},
    {key:"requests", label:"请求"},
    {key:"cost",     label:"成本",    disabled:!k.cost.computable,    hint:k.cost.note},
    {key:"savings",  label:"节省额",  disabled:!k.savings.computable, hint:k.savings.note}
  ];
  /* 轮询刷新后当前档被禁用(可算性翻转)→ 回落 tokens */
  var cur = MODES.filter(function(m){ return m.key===curMode; })[0];
  if(!cur || cur.disabled) curMode = "tokens";
  var seg = $("seg");
  seg.innerHTML = "";
  MODES.forEach(function(m){
    var b = document.createElement("button");
    b.textContent = m.label;
    b.dataset.key = m.key;
    if(m.disabled){ b.disabled = true; b.title = m.hint || "不可算"; }
    if(m.key===curMode) b.className = "on";
    b.addEventListener("click", function(){
      curMode = m.key;
      Array.prototype.forEach.call(seg.children,function(x){ x.className = x.dataset.key===curMode ? "on" : ""; });
      renderHeat();
    });
    seg.appendChild(b);
  });
}

/* 票05 接线(终局留底#1):成本/节省额档取 days[].savings 端点字段——
   成本档=毛省 gross(避免成本);节省额档=净额 net(真值带符号在 tooltip,
   配色取幅值走既有负值日冷梯度 n 系)。不可算(computable=false)恒 null=不点亮。 */
function dayValue(d, mode){
  if(mode==="tokens") return d.input + d.cache_read + d.cache_creation + d.output;
  if(mode==="requests") return d.requests;
  var s = d.savings;
  if(!s || !s.computable) return null;
  if(mode==="cost") return s.gross==null ? null : s.gross;
  if(mode==="savings") return s.net==null ? null : Math.abs(s.net);
  return null;
}
function quartiles(vals){
  var s = vals.slice().sort(function(a,b){return a-b;});
  function q(p){ return s[Math.min(s.length-1, Math.floor(p*s.length))]; }
  return [q(0.25), q(0.5), q(0.75)];
}
function level(v, qs){
  if(v<=qs[0]) return 1;
  if(v<=qs[1]) return 2;
  if(v<=qs[2]) return 3;
  return 4;
}

/* 列=周(首列从 days[0] 所在周的周一算起),行=周一..周日 */
function monIdx(dateStr){ /* 周一=0 .. 周日=6 */
  var dt = new Date(dateStr+"T00:00:00");
  return (dt.getDay()+6)%7;
}

function renderHeat(){
  var vals = D.days.map(function(d){ return dayValue(d,curMode); });
  var nz = vals.filter(function(v){ return v>0; });
  var qs = nz.length ? quartiles(nz) : [1,2,3];
  var hasNeg = D.days.some(function(d){ return d.neg; });

  var heat = $("heat");
  heat.innerHTML = "";
  var pad = monIdx(D.days[0].date); /* 首列前置空格 */
  for(var i=0;i<pad;i++){
    var blank = document.createElement("div");
    blank.style.cssText = "width:11px;height:11px";
    heat.appendChild(blank);
  }
  D.days.forEach(function(d,i){
    var cell = document.createElement("div");
    cell.className = "cell";
    var v = vals[i];
    if(d.neg && v>0){
      cell.classList.add("n"+level(v,qs));
    }else if(v>0){
      cell.classList.add("l"+level(v,qs));
    }
    cell.dataset.idx = i;
    heat.appendChild(cell);
  });

  /* 月份标签:每列(周)首日为新月则标;
     r2 防重叠:窗口起点所在月不足3天不标;相邻标签起始列至少隔3列,不足则跳过后者 */
  var months = $("months");
  months.innerHTML = "";
  var totalSlots = pad + D.days.length;
  var cols = Math.ceil(totalSlots/7);
  var firstM = D.days[0].date.slice(0,7);
  var firstMDays = 0;
  for(var fi=0; fi<D.days.length && D.days[fi].date.slice(0,7)===firstM; fi++) firstMDays++;
  var prevM = "";
  var lastLabelCol = -99; /* 上一个已显示标签所在列 */
  for(var c=0;c<cols;c++){
    var slot = c*7; /* 该列第一个 slot 对应 days 下标 slot-pad */
    var label = "";
    for(var r=0;r<7;r++){
      var j = slot + r - pad;
      if(j>=0 && j<D.days.length){
        var m = D.days[j].date.slice(0,7);
        if(m!==prevM){
          prevM = m;
          var skipFirst = (m===firstM && firstMDays<3);
          if(!skipFirst && c-lastLabelCol>=3){
            label = m.slice(5)+"月";
            lastLabelCol = c;
          }
        }
        break;
      }
    }
    var sp = document.createElement("span");
    sp.textContent = label;
    sp.style.gridColumn = (c+1);
    months.appendChild(sp);
  }

  /* 图例 */
  var lg = $("legend");
  var h = '少 <span class="sw" style="background:var(--heat1)"></span>'+
          '<span class="sw" style="background:var(--heat2)"></span>'+
          '<span class="sw" style="background:var(--heat3)"></span>'+
          '<span class="sw" style="background:var(--heat4)"></span> 多';
  if(hasNeg){
    h += '<span style="margin-left:14px">负值日 <span class="sw" style="background:var(--neg2)"></span>'+
         '<span class="sw" style="background:var(--neg4)"></span></span>';
  }
  lg.innerHTML = h;
}

/* 格子 tooltip(金额档显示带符号真值;tokens/请求与 mock 同款) */
var tip = $("tip");
$("heat").addEventListener("mouseover", function(e){
  var t = e.target;
  if(!t.classList || !t.classList.contains("cell") || t.dataset.idx===undefined) return;
  var d = D.days[Number(t.dataset.idx)];
  var money = (curMode==="cost" || curMode==="savings");
  var modeLabel = {tokens:"Tokens",requests:"请求",cost:"毛省",savings:"净省"}[curMode] || curMode;
  var shown = money
    ? fmtCredits(curMode==="cost" ? d.savings.gross : d.savings.net)
    : fmtTok(dayValue(d,curMode));
  var ev = d.events;
  tip.innerHTML =
    '<div class="d">'+d.date+"</div>"+
    "<div>"+modeLabel+': <b class="num">'+shown+"</b>"+(d.neg?' <span style="color:var(--cyan)">(负值日)</span>':"")+"</div>"+
    '<div class="dim num">输入 '+fmtTok(d.input)+" · 缓存读 "+fmtTok(d.cache_read)+"<br>缓存写 "+fmtTok(d.cache_creation)+" · 输出 "+fmtTok(d.output)+"</div>"+
    '<div class="dim num">请求 '+d.requests+" · 交接 "+ev.handoff+" · 注入 "+ev.inject+"<br>窗口 "+ev.window+" · 拦截 "+ev.block+" · 放行 "+ev.bypass+"</div>";
  tip.style.display = "block";
  var r = t.getBoundingClientRect();
  var x = r.left, y = r.bottom + 6;
  tip.style.left = "0px"; tip.style.top = "0px";
  var tw = tip.offsetWidth, th = tip.offsetHeight;
  if(x+tw > window.innerWidth-8) x = window.innerWidth - tw - 8;
  if(y+th > window.innerHeight-8) y = r.top - th - 6;
  tip.style.left = x+"px"; tip.style.top = y+"px";
});
$("heat").addEventListener("mouseleave", function(){ tip.style.display = "none"; });
$("heat").addEventListener("mouseout", function(e){
  if(!e.relatedTarget || !e.relatedTarget.classList || !e.relatedTarget.classList.contains("cell"))
    tip.style.display = "none";
});

/* ---------- 明细表(/stats/usage 服务端分页) ---------- */
var PAGE = 20, page = 0;
var fFrom = $("f-from"), fTo = $("f-to"), fProj = $("f-project"), fModel = $("f-model");
var usage = { rows: [], total: 0 }; /* 最近一次成功响应 */
var usageGen = 0; /* 代际:筛选/翻页连点时过期响应弃用 */

function usageQuery(){
  var q = new URLSearchParams();
  if(fFrom.value) q.set("since", fFrom.value);
  if(fTo.value) q.set("until", fTo.value);
  if(fProj.value.trim()) q.set("project", fProj.value.trim()); /* 端点=全路径精确匹配 */
  if(fModel.value.trim()) q.set("model", fModel.value.trim());  /* 端点=包含匹配(不分大小写) */
  q.set("limit", PAGE);
  q.set("offset", page*PAGE);
  return q.toString();
}

async function loadUsage(){
  var gen = ++usageGen;
  try{
    var j = await api("/stats/usage?"+usageQuery());
    if(gen!==usageGen) return true; /* 过期响应(用户已再操作):弃 */
    if(!j || !Array.isArray(j.rows)) throw new Error("坏响应");
    /* 数据收缩防夹空页:非首页整页越界 → 收页重拉一次 */
    if(page>0 && j.total>0 && page*PAGE >= j.total){
      page = Math.max(0, Math.ceil(j.total/PAGE)-1);
      return loadUsage();
    }
    usage = j;
    renderTable();
    return true;
  }catch(e){
    setErr(true); /* 不清已渲染内容 */
    return false;
  }
}

function shortProject(p){
  var parts = p.split(/[\\/]/).filter(Boolean);
  return parts.length ? parts[parts.length-1] : p;
}
function renderTable(){
  var rows = usage.rows || [];
  var total = usage.total || 0;
  var pages = Math.max(1, Math.ceil(total/PAGE));
  var html = "";
  rows.forEach(function(r){
    html += "<tr>"+
      "<td class=num>"+esc(r.ts_iso.slice(0,16).replace("T"," "))+"</td>"+
      '<td class="ellipsis" title="'+esc(r.project)+'">'+esc(shortProject(r.project))+"</td>"+
      "<td>"+esc(String(r.session_id||"").slice(0,12))+"</td>"+
      "<td>"+esc(r.model)+"</td>"+
      '<td class="num">'+fmtInt(r.input_tokens)+"</td>"+
      '<td class="num">'+fmtInt(r.output_tokens)+"</td>"+
      '<td class="num">'+fmtInt(r.cache_read_tokens)+"</td>"+
      '<td class="num">'+fmtInt(r.cache_creation_tokens)+"</td>"+
      '<td class="num">'+(r.cost==null ? "—" : fmtCredits(r.cost))+"</td>"+
    "</tr>";
  });
  if(!rows.length) html = '<tr><td colspan="9" style="color:var(--txt-dim);text-align:center">无匹配记录</td></tr>';
  $("tbody").innerHTML = html;
  $("pageinfo").textContent = "第 "+(page+1)+" / "+pages+" 页 · 共 "+total+" 条";
  $("prev").disabled = page<=0;
  $("next").disabled = page>=pages-1;
}
var filterTimer = null;
[fFrom,fTo,fProj,fModel].forEach(function(el){
  el.addEventListener("input", function(){
    if(filterTimer) clearTimeout(filterTimer); /* 300ms 防抖:逐键过滤=逐次全账本扫 */
    filterTimer = setTimeout(function(){ page=0; loadUsage(); }, 300);
  });
});
$("prev").addEventListener("click", function(){ if(page>0){page--; loadUsage();} });
$("next").addEventListener("click", function(){ page++; loadUsage(); });

/* ---------- 轮询主循环:首屏立即拉,其后每 POLL_MS 一轮;任一失败只亮错误条 ---------- */
async function loadSummary(){
  try{
    var j = await api("/stats/summary");
    if(!j || !j.kpi || !Array.isArray(j.days)) throw new Error("坏响应");
    D = j;
    renderSummary();
    return true;
  }catch(e){
    setErr(true); /* 不清已渲染内容 */
    return false;
  }
}
/* 可见性节拍(与账本常驻缓存同批上线,ADR-0027):隐藏即暂停(下轮 tick 跳过取数,
   守护零请求)、显示即恢复并立刻刷一轮、可见时 30s 节拍不变。首屏这一轮
   无条件拉(页面随常驻隐藏窗在启动时加载,先备一版数据防首开空白);
   visibilitychange 为主,壳层 stats-restored 事件为备(托盘再开统计窗补刷);
   两者都缺席时退化为旧恒轮询——后端已毫秒级,可承受。 */
var pollTimer = null;
async function pollTick(fetchNow){
  if(fetchNow || !document.hidden){
    await resolveTarget(); /* 每轮现读 token:daemon 重启换 token 后下轮自动生效 */
    var res = await Promise.all([loadSummary(), loadUsage()]);
    setErr(!(res[0] && res[1]));
  }
  if(pollTimer) clearTimeout(pollTimer);
  pollTimer = setTimeout(function(){ pollTick(false); }, POLL_MS);
}
function pokeNow(){ pollTick(true).catch(function(){ setErr(true); }); }
document.addEventListener("visibilitychange", function(){
  if(!document.hidden) pokeNow(); /* 显示:立即刷一轮并重置节拍 */
});
(function(){
  var t = window.__TAURI__;
  if(t && t.event && t.event.listen){
    t.event.listen("stats-restored", function(){ pokeNow(); })
      .catch(function(){ /* 监听失败:退化为纯 visibilitychange 面 */ });
  }
})();
pollTick(true).catch(function(){ setErr(true); });
})();
</script>
