# Ferryman 发布流水线——仅在推送 semver tag(v* 且严格 vX.Y.Z / vX.Y.Z-<pre>)时触发。
#
# 发布操作要求 annotated tag(附注标签):
#   git tag -a v0.1.0 -m "First public release"
#   git push origin v0.1.0
# lightweight tag(轻量标签)没有注释对象,Release body 会是空的——务必用 annotated tag。
#
# 所有 run 步骤显式 shell: bash:windows-latest runner 默认 shell 是 pwsh,而
# ${GITHUB_REF_NAME} 展开与 sha256sum 是 bash 语法;runner 自带 Git Bash(F11/G2);
# macos-latest 默认 shell 本就是 bash,shasum 输出格式与 sha256sum 一致(两空格分隔)。
#
# 发布直接 publish(不加 draft),用 runner 预装的 gh CLI,不引第三方 release action。
# 含预发布后缀(-rc. / -beta. / -alpha. / 任意 -<pre> 段)的 tag 会把 Release 标为
# prerelease: true——GitHub latest 通道只返回非 prerelease 非 draft,默认忽略预发布。
#
# v0.9.25 起双平台发布(macOS 移植):windows 作业建 Release 并上传 exe;
# macos 作业(needs windows)构建 darwin/arm64 压缩包补传。macos 作业失败时
# Release 已带 Windows 产物,可 gh run rerun 或手动 gh release upload 补传,
# 不回滚 Release。
# macos 作业只构建不跑测试:cutover/dshsandbox 等包的部分测试断言 Windows 形态
# (VBS/schtasks/USERPROFILE 语义),darwin 上必红;darwin 测试面收口后再加回。

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 全量检出:保证 annotated tag 对象在本地,tag_notes 提取不落空(浅检出对
          # %(contents) 有翻车前科);本仓小,全量成本可忽略。
          fetch-depth: 0

      - name: Setup Go (version from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        shell: bash
        run: go vet ./...

      - name: Test
        shell: bash
        run: go test ./...

      - name: Build (inject tag as main.version)
        shell: bash
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o ferryman_windows_amd64.exe ./cmd/ferryman

      - name: Checksum
        shell: bash
        run: sha256sum ferryman_windows_amd64.exe > ferryman_windows_amd64.exe.sha256

      - name: Validate tag is strict semver (vX.Y.Z or vX.Y.Z-<pre>)
        shell: bash
        run: |
          # 完整 strict semver(带 v 前缀):拒绝前导零、缺分量、非数字分量;不含 build metadata。
          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [[ ! "$GITHUB_REF_NAME" =~ $semver_re ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not strict semver (vX.Y.Z or vX.Y.Z-<pre>); refusing to release."
            exit 1
          fi
          echo "tag ok: ${GITHUB_REF_NAME}"

      - name: Detect prerelease (any -<pre> segment)
        id: pre
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract tag annotation as release body
        shell: bash
        run: |
          # 显式从 origin 拉 tag ref:checkout 在 tag 事件下可能把本地 refs/tags/<tag>
          # 建成直指 commit(peeled)的形态,annotated tag 对象不在,%(contents) 会落空
          # (v0.1.0 首发实证:body 回退成了合并提交消息)。
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > tag_notes.txt

      - name: Create release (publish directly, no draft)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.pre.outputs.is_prerelease }}
        run: |
          args=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            ferryman_windows_amd64.exe ferryman_windows_amd64.exe.sha256 \
            --title "ferryman ${GITHUB_REF_NAME}" \
            --notes-file tag_notes.txt \
            "${args[@]}"

  release-macos:
    # macOS 产物补传作业:windows 作业已建好 Release,这里只构建并 upload。
    # darwin/arm64 单架构(Intel Mac 不在支持面);cgo/clang 由 runner 的 Xcode 提供,
    # systray 的 darwin 端要求 cgo——本作业就是 macOS 版的构建真源。
    needs: release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go (version from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build darwin/arm64 + package (inject tag as main.version)
        shell: bash
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o ferryman ./cmd/ferryman
          tar czf ferryman_darwin_arm64.tar.gz ferryman
          shasum -a 256 ferryman_darwin_arm64.tar.gz > ferryman_darwin_arm64.tar.gz.sha256

      - name: Upload darwin assets to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            ferryman_darwin_arm64.tar.gz ferryman_darwin_arm64.tar.gz.sha256 \
            --clobber
