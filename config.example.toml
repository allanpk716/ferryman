# Ferryman 配置样例 —— 复制到 ~/ferryman/config.toml 并填入真实凭据。
# 真实配置在仓库外，永不入库。代码不内置任何默认 provider：
# 未配置 [ferry] provider 时摆渡将降级为骨架交接（worker 警告，doctor 提示）。

[ferry]
# 摆渡用 provider —— 必须对应下面某个 [providers.X] 的名字；不配则摆渡降级骨架
provider = "deepseek"

[dock]
# 渡口（票01 多上游，ADR-0011）：CC 与上游之间的本机转发层。
# CC 的 ANTHROPIC_BASE_URL 指到 http://127.0.0.1:15722 是人工一次性步骤，
# 程序不改写 CC 的任何配置。active 单选一条渡口上游；换上游＝改 active＋重启。
# rewrite 隐含开启：上游为本地中转地址（如 127.0.0.1:15721）时守卫强制透传。
listen = "127.0.0.1:15722"
active = "智谱"

[dock.upstreams."智谱"]
# 预置：智谱 GLM Coding Plan（模型拼写以官方文档为准，填 key 后即可用）
base_url = "https://open.bigmodel.cn/api/anthropic"
api_key = ""
model_map = { default = "glm-5.3", opus = "glm-5.3", sonnet = "glm-5.3", haiku = "glm-5.3-flash" }
balance_url = "https://open.bigmodel.cn/api/user/balance"

[dock.upstreams.kimi]
# 预置：Kimi Coding Plan（key 在 Kimi Code 控制台建，与 API 开放平台 key 不通用；
# 不用 kimi-for-coding-highspeed——其"强制 thinking"属性未核实）
base_url = "https://api.kimi.com/coding/"
api_key = ""
model_map = { default = "kimi-for-coding", sonnet = "kimi-for-coding", opus = "k3", haiku = "k3-256k" }

[dock.upstreams.deepseek]
# 预置：DeepSeek 按量（Anthropic 兼容端点；官方已知边界见 doctor/文档）
base_url = "https://api.deepseek.com/anthropic"
api_key = ""
model_map = { default = "deepseek-flash", sonnet = "deepseek-flash", haiku = "deepseek-flash", opus = "deepseek-v4-pro" }

#[dock.upstreams.cc-switch]
# 回退条目示例（旧单值配置首启自动迁移出的形态）：指向 cc-switch 本地中转时
# 守卫强制透传（防双重改写）。要回退就把 active 改回 "cc-switch" 并重启。
#base_url = "http://127.0.0.1:15721"
#api_key = ""
#
# 条目字段：base_url（必填）/ api_key（可空＝未激活占位）/ model_map（非本地
# 条目必含非空 default；可选 opus/sonnet/haiku 档位键）/ text_only（可选，
# 命中映射后模型名的 image 块降级文本占位）/ balance_url（可选，不配不显示）。
# 换上游：active 改成条目名（TOML 键），重启守护生效。

[providers.local]
# 自建 OpenAI 兼容网关示例（vLLM / SGLang / ollama 等）——地址按你的实际环境填
# 注意：[providers] 是摆渡供应商表（OpenAI 协议），与上面 [dock.upstreams]
# （渡口上游，Anthropic 协议）完全分立、互不联动。
base_url = "http://<你的推理网关地址>:<端口>/v1"
model = "<你的模型名>"
window = 131072
# api_key = ""

[providers.deepseek]
# 验证期执行默认（DESIGN §6.5）—— 需要填 API key（https://platform.deepseek.com）
base_url = "https://api.deepseek.com/v1"
model = "deepseek-v4.1-flash"   # 确切模型名以官方 pricing 页为准
window = 1048576
# api_key = "sk-..."

[providers.glm]
# 智谱直连（BigModel 开放平台）—— Coding Plan 不含外部 API 额度，需单独资源包
base_url = "https://open.bigmodel.cn/api/paas/v4"
model = "glm-5.3-flash"
window = 1048576
# api_key = "..."

[notify]
# 拦截通知（T25）：block 时 Pushover（手机）+ Windows Toast（桌面），文案带交接路径。
# enabled 默认 false；凭据留空则回落环境变量 PUSHOVER_TOKEN / PUSHOVER_USER
# （与 claude-notify 插件共用同一对，HKCU 用户级）。
enabled = true
pushover = true
toast = true
# pushover_token = ""
# pushover_user = ""

#[thresholds]
# cache_warn_s = 720    # 闲置12分钟的纯提醒：缓存已死、本条全价（0=关）

#[watch]
# codex_extra_dirs = []   # 额外 codex 会话目录；Orca 运行时目录
#                         # (%APPDATA%\orca\codex-runtime-home\home\sessions) 存在时自动追加
#                         # ——2026-09-17 真机抓包发现经 Orca 启动的 codex 写在那里
# harvest_usage = true   # 用量采集（usage 科目）：会话文件 30 天清理后的审计地基

[prices.glm]
# 费用账本（T41）：GLM Coding Plan 积分系数（2026-09-17 实测口径，
# 见 docs/20260917_1630_GLM缓存TTL实测与心跳保温可行性_实验报告.md §4）
unit = "智谱积分"
per = 10000                # 每万 token 计价

[[prices.glm.versions]]
effective_from = "2026-09-17"
p_in = 6.9
p_cache = 1.7              # 不写此键 = 无缓存价：策略计算器拒算、report 标注不可算
p_out = 24

[heartbeat]
# 心跳保活（T41 仅预留配置节——执行器未实装，默认关闭；设计文档 §3）
enabled = false
# 实测缓存 TTL（跑 experiments/cache-ttl 套件后填；report 策略对比依赖此值）
# ttl_s = 600
# ttl_measured_at = "2026-09-17"
# ttl_source = "docs/20260917_1630_GLM缓存TTL实测与心跳保温可行性_实验报告.md"

#[question_watch]
# 问询守望（T51）：提问潮会话的等答复窗口＋缓存保温心跳，默认 off。
# mode = "off"                  # off | observe | enforce（三态永不自动升级）
# min_questions = 5             # 提问潮阈值：末条 assistant 问题单元数 ≥ 此值命中
# beat_interval_s = 420         # 心跳间隔：0.7×GLM 实测 TTL 600s
# max_beats = 2                 # 每窗最多心跳跳数
# ferry_deadline_lead_s = 480   # 摆渡死线提前量：下限夹取 60s；
#                               # summarize_s + lead > block_s 拒绝启动
